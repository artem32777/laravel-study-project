x-laravel: &laravel
    image: lara-n:local
    build: .
    env_file: .env
    environment:
        APP_URL: http://localhost:8080
        DB_CONNECTION: pgsql
        DB_HOST: postgres
        DB_PORT: "5432"
        MAIL_HOST: mailpit
    volumes:
        - lara-storage:/app/storage
    depends_on:
        postgres:
            condition: service_healthy
        mailpit:
            condition: service_started

services:
    app:
        <<: *laravel
        command: [ php, artisan, serve, "--host=0.0.0.0", "--port=8000", "--no-reload", "--no-interaction" ]
        ports:
            - "127.0.0.1:8080:8000"
    worker:
        <<: *laravel
        command: [ php, artisan, "queue:work", "--no-interaction" ]

    postgres:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: lara
            POSTGRES_PASSWORD: secret
            POSTGRES_DB: lara_n
        volumes:
            - lara-postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: [ CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"' ]
            interval: 5s
            timeout: 3s
            retries: 12

    mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
            - "127.0.0.1:1025:1025"
            - "127.0.0.1:8025:8025"
volumes:
    lara-postgres-data:
    lara-storage:
